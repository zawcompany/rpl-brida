# SIMPIL — Nginx di belakang ALB (TLS dihentikan di ALB; instance hanya melayani HTTP :80)
server {
    listen 80 default_server;
    server_name _;
    root /var/www/simpil/public;
    index index.php;

    # Unggahan naskah maks. 10 MB (+overhead form) — harus sejalan dengan php.ini & FormRequest
    client_max_body_size 12M;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Tidak ada berkas tersembunyi / kode yang dilayani
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/simpil-error.log;
    access_log /var/log/nginx/simpil-access.log;
}
