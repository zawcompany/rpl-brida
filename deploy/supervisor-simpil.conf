; SIMPIL — worker antrean Redis (email verifikasi, pengingat review, dst.)
[program:simpil-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/simpil/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/simpil
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3610
redirect_stderr=true
stdout_logfile=/var/log/simpil-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
