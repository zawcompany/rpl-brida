# SIMPIL — satu server EC2 dengan Docker Compose, image dari Amazon ECR, log ke CloudWatch.
# Untuk tugas/demo, BUKAN arsitektur produksi berskala (lihat deploy/aws/ECS-DEPLOY.md untuk itu).
#
# Variabel (dari .env di server, dibuat dari SSM Parameter Store oleh skrip boot):
#   ECR_REGISTRY=<ACCOUNT_ID>.dkr.ecr.ap-southeast-3.amazonaws.com    IMAGE_TAG=<tag>
# Layanan AWS yang dipakai: EC2, ECR (image), S3 (naskah), SQS (antrean), SES (surel),
#   CloudWatch Logs (log container), IAM Role (tanpa access key), SSM (rahasia & akses).

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ap-southeast-3
    awslogs-group: /simpil/ec2
    awslogs-create-group: "false"

x-app: &app
  image: ${ECR_REGISTRY:?isi ECR_REGISTRY di .env}/simpil-app:${IMAGE_TAG:-latest}
  env_file: .env
  working_dir: /var/www/html
  restart: unless-stopped
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: db
    DB_PORT: 3306
    RUN_MIGRATIONS: "false"
  volumes:
    - storage:/var/www/html/storage
    - publicdisk:/var/www/html/storage/app/public   # sampul edisi; juga dibaca Nginx lewat /storage

services:
  # Satu kali jalan: volume baru dimiliki root, pastikan www-data bisa menulis.
  perms:
    image: ${ECR_REGISTRY}/simpil-app:${IMAGE_TAG:-latest}
    user: root
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p storage/app/private storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && chown -R www-data:www-data storage"]
    working_dir: /var/www/html
    volumes:
      - storage:/var/www/html/storage
      - publicdisk:/var/www/html/storage/app/public

  app:
    <<: *app
    logging:
      <<: *logging
      options: {awslogs-region: ap-southeast-3, awslogs-group: /simpil/ec2, awslogs-stream: app}
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      perms:
        condition: service_completed_successfully

  queue:
    <<: *app
    logging:
      <<: *logging
      options: {awslogs-region: ap-southeast-3, awslogs-group: /simpil/ec2, awslogs-stream: queue}
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
    depends_on:
      app:
        condition: service_started

  web:
    image: ${ECR_REGISTRY}/simpil-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      <<: *logging
      options: {awslogs-region: ap-southeast-3, awslogs-group: /simpil/ec2, awslogs-stream: web}
    environment:
      PHP_FPM_HOST: app
    ports:
      - "80:80"
    volumes:
      - publicdisk:/var/www/html/public/storage:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?isi DB_DATABASE di .env}
      MYSQL_USER: ${DB_USERNAME:?isi DB_USERNAME di .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di .env}
    # Tanpa "ports": MySQL hanya terjangkau container lain, tidak dari internet.
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  storage:
  publicdisk:
