; SIMPIL — PHP (sejalan dengan deploy/provision-ec2.sh & client_max_body_size Nginx)
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 128
; Produksi: 0 (kode tidak berubah dalam container). Dev: set PHP_OPCACHE_VALIDATE=1 di compose.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE:-0}
